services:
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: mrp-garage-s3
    restart: unless-stopped
    ports:
      - 3900:3900
      - 3901:3901
      - 3902:3902
      - 3903:3903
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    environment:
      - GARAGE_ALLOW_WORLD_READABLE_SECRETS=true
    networks:
      - mrp-network

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: mrp-garage-webui
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - 3909:3909
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    networks:
      - mrp-network

  redis:
    image: redis:8.4.0-alpine
    container_name: mrp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - mrp-network

  # Optional local transcription engine. Does NOT start with a plain `docker compose up`;
  # bring it up with the profile:  docker compose --profile whisperx up   (or `pnpm docker:whisperx`).
  # Then set WHISPERX_ENABLED=true in packages/backend/.env to offer it in the UI.
  whisperx:
    build:
      context: ../whisperx-service
      dockerfile: Dockerfile
    image: mrp-whisperx:latest
    container_name: mrp-whisperx
    restart: unless-stopped
    profiles: ["whisperx"]
    ports:
      - "8001:8001"
    # Sidecar settings (WHISPERX_HF_TOKEN, WHISPERX_MODEL, WHISPERX_DEVICE,
    # WHISPERX_IDLE_TTL_SECONDS, ...) live in whisperx-service/.env — copy
    # whisperx-service/.env.example to create it. Optional: app.py supplies sane
    # defaults for anything omitted, so the file can be absent or partial.
    env_file:
      - path: ../whisperx-service/.env
        required: false
    volumes:
      - whisperx_cache:/root/.cache                   # persist downloaded models across restarts
    networks:
      - mrp-network
    # GPU: install the NVIDIA Container Toolkit, set WHISPERX_DEVICE=cuda, and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  garage_data:
  garage_meta:
  redis_data:
  whisperx_cache:

networks:
  mrp-network:
    driver: bridge
