services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${BASE_PATH:-/mrp-5g-session-processor}
    container_name: mrp-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      BASE_PATH: ${BASE_PATH:-/mrp-5g-session-processor}
      SERVE_STATIC: "true"
      STATIC_PATH: /app/public
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_PATH: /app/data/mrp.db
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.example.com}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_BUCKET: ${S3_BUCKET:-mrp-videos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-garage}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_TRANSCRIPTION: ${OPENAI_MODEL_TRANSCRIPTION:-gpt-4o-transcribe-diarize}
      OPENAI_MODEL_SEGMENTATION: ${OPENAI_MODEL_SEGMENTATION:-gpt-5.1}
      OPENAI_MODEL_METADATA: ${OPENAI_MODEL_METADATA:-gpt-5.1}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      SIMULATOR_VOICES: ${SIMULATOR_VOICES}
      SIMULATOR_PAUSE_BETWEEN_SEGMENTS_MS: ${SIMULATOR_PAUSE_BETWEEN_SEGMENTS_MS:-1000}
      SIMULATOR_AUDIO_CONCURRENCY: ${SIMULATOR_AUDIO_CONCURRENCY:-3}
      OPEN_WEBUI_BASE_URL: ${OPEN_WEBUI_BASE_URL:-}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_MODEL: ${OPEN_WEBUI_MODEL:-gpt-oss:20b}
      TRANSCRIPTION_ENGINE_DEFAULT: ${TRANSCRIPTION_ENGINE_DEFAULT:-openai}
      WHISPERX_ENABLED: ${WHISPERX_ENABLED:-false}
      WHISPERX_DEVICE: ${WHISPERX_DEVICE:-cpu}
      WHISPERX_SERVICE_URL: ${WHISPERX_SERVICE_URL:-http://whisperx:8001}
    volumes:
      - ./data/app:/app/data
    depends_on:
      - redis
      - garage
    networks:
      - mrp-network

  redis:
    image: redis:8.4.0-alpine
    container_name: mrp-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    networks:
      - mrp-network

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: mrp-garage-s3
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./data/garage/data:/var/lib/garage/data
      - ./data/garage/meta:/var/lib/garage/meta
    environment:
      - GARAGE_ALLOW_WORLD_READABLE_SECRETS=true
    networks:
      - mrp-network

  # Optional local transcription engine. Opt-in via the `whisperx` profile so a plain
  # `docker compose -f docker/docker-compose.prod.yml up` is unchanged. Enable with:
  #   docker compose -f docker/docker-compose.prod.yml --profile whisperx up -d
  # and set WHISPERX_ENABLED=true (already wired on the app service above).
  whisperx:
    build:
      context: ../whisperx-service
      dockerfile: Dockerfile
    image: mrp-whisperx:latest
    container_name: mrp-whisperx
    restart: unless-stopped
    profiles: ["whisperx"]
    # Sidecar settings live in whisperx-service/.env (copy whisperx-service/.env.example).
    env_file:
      - path: ../whisperx-service/.env
        required: false
    volumes:
      - ./data/whisperx-cache:/root/.cache
    networks:
      - mrp-network
    # GPU: install the NVIDIA Container Toolkit, set WHISPERX_DEVICE=cuda, and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  mrp-network:
    driver: bridge
